plugins {
    id 'application'
}

def defaultBuildRoot = new File(
    System.getProperty('user.home'),
    ".weirdkey/build-${Integer.toUnsignedString(rootProject.projectDir.absolutePath.hashCode())}"
)
layout.buildDirectory = providers.environmentVariable('WEIRDKEY_BUILD_ROOT')
    .map { new File(it, 'app') }
    .orElse(defaultBuildRoot.toString())

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'net.java.dev.jna:jna-platform:5.19.1'
}

testing {
    suites {
        test {
            useJUnitJupiter('6.0.1')
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'weirdkey.App'
}
